<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | One Love Tattoos</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #151922 0%, #080a0d 100%);
      padding: 24px;
    }
    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-lg);
      padding: 44px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.15);
      position: relative;
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: radial-gradient(circle, #2a2211, #131720);
      border: 1px solid var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
    }
    .demo-credentials {
      background: rgba(212, 175, 55, 0.08);
      border: 1px dashed var(--border-gold);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 0.82rem;
      margin-bottom: 24px;
      color: #e2e8f0;
      line-height: 1.5;
    }
    .demo-credentials code {
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent-gold-light);
      font-family: monospace;
    }
    .error-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="login-header">
      <div class="login-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>
      <h2 style="font-size: 1.5rem; color: #fff; margin-bottom: 4px;">Studio Admin Portal</h2>
      <p style="font-size: 0.88rem; color: var(--text-secondary);">One Love Tattoos & Piercing</p>
    </div>

    <div class="demo-credentials">
      <div style="font-weight: 600; color: var(--accent-gold); margin-bottom: 4px;">🔑 Default Admin Credentials:</div>
      <div>Username: <code>admin</code></div>
      <div>Password: <code>onelove2026</code></div>
    </div>

    <div id="loginError" class="error-alert"></div>

    <form id="loginForm">
      <div class="form-group" style="margin-bottom: 18px;">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" class="form-input" value="admin" required autocomplete="username" />
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" value="onelove2026" required autocomplete="current-password" />
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;">
        Log In to Dashboard
      </button>

      <div style="text-align: center;">
        <a href="/" style="font-size: 0.85rem; color: var(--text-muted);">
          ← Return to Public Website
        </a>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/admin';
        } else {
          errBox.textContent = data.detail || 'Invalid username or password.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = 'Network error. Please try again.';
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log In to Dashboard';
      }
    });
  </script>
</body>
</html>
